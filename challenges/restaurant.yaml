challenge_rules:
  restart:
    source: §5.5.1
    allowed: 1
    note: All points earned before the restart are voided; scoring resumes from zero.
  barman_assistance:
    source: §5.5 remarks
    note: The Professional Barman assists on request; robot may use up to two minutes to instruct the barman per order. If requested, the barman will place the order in a basket or tray.
  disqualifying:
  - id: DQ-R-TOUCH
    description: Touching the robot after the start signal
  - id: DQ-R-PREMAP
    description: Mapping the environment in advance
  emergency_stop:
    source: §5.5 procedure 4
    note: A TC member follows the robot ready to press the emergency stop button; any physical contact with people or furniture results in immediate emergency stop.
