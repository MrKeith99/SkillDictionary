  section: Greeting
  assistance:
    permitted: false
    note: Waiting for the doorbell is optional; robots may bypass it and meet the guest at the door. Bypassing is an alternative strategy, not assistance.
  note: Scored only if robot waits at starting position and reacts instantly.
- ref: MAN-OPEN-01
  count: 2
  section: Greeting
  assistance:
    permitted: true
    listed_in_task_description: true
    self_score: 0
