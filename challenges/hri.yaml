challenge: Human Robot Interaction Challenge
rulebook_section: '5.1'
max_time_minutes: 7
total_score: 1450
dictionary_ref: ../dictionary/
global_rules_ref: ../vocabulary/global_rules.yaml
challenge_rules:
  custom_operator:
    permitted: false
    source: §5.1 rule 4
    note: Since the main focus of the test is HRI, no custom operator can be chosen.
  alternative_hri:
    permitted: true
    penalty_ref: GEN-ALTERNATIVEHRI-01P
    note: Score reduction per information (name or favorite drink).
