# Doing Laundry: one fold line — PROPOSAL for 2027, not in force.
#
# 2026 prices the same task twice: "Folding a piece of clothing" 800 and
# "Folding additional clothes" 400, both MAN.Fold on the same garments (D4).
# The extra 400 rewards reaching the main goal, not a harder fold. Same for
# their penalties: quality -800 / -400, flattening help -200 / -100, folding
# help up to -800 / -400.
#
# Proposal: every garment is the same fold line (400) with the same penalties;
# the main-goal premium becomes an explicit bonus, as P&P does with its
# First Pick Bonus. Values are the 2026 ones, so the maximum is unchanged
# (4415); only the structure is consistent.

