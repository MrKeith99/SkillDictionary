# GPSR scored by skill — PROPOSAL for 2027, not in force.
#
# 2026 pays a flat 250 per solved command, whatever the command asked for:
# "go to the kitchen" and "find a coke, take it and give it to the waving
# person in the bedroom" earn the same. The command is drawn at test time
# (official CommandGenerator), so a flat price cannot be fair.
#
# Proposal: a command earns the skill lines it actually exercises, each at the
# same price that skill has everywhere else (vocabulary/pricing.yaml), plus a
# completion bonus when the command's goal holds. PLN.Execute stops being the
# score and becomes the bonus for finishing.
#
# tools/build_proposal.py overlays this file on dist/ into dist/proposal_2027/,
# prices the new lines with the 2027 rule, and writes the score sheet. The
# 2026 dictionary, challenges and rulebook checks are untouched.

year: 2027
status: proposal
slug: gpsr
command_generator:
  repo: https://github.com/RoboCupAtHome/CommandGenerator
  path: src/robocupathome_generator/gpsr_commands.py
  commit: fa8b9adf52c876042b81b7dbfd0e50fc00ef5cc6

# ── new dictionary lines: the steps a GPSR command can contain ──────────────
# Conditions: arena in nominal configuration (§ GPSR Setup), a few volunteers,
# commands may leave the room. Points are filled in by the pricing rule.
dictionary_additions:
- id: NAV-NAVIGATE-06
  area: NAV
  skill: Navigate
  variant_number: '06'
  taxonomy: NAV.Navigate
  modifiers: [named_location]
  description: Reach the named room or location
  conditions: {map_knowledge: mapped, route_extent: rooms, crowd: few, obstacle_visibility: large}
  level: '-'
  type: achievement
- id: OBJ-RECOGNIZE-02
  area: OBJ
  skill: Recognize
  variant_number: '02'
  taxonomy: OBJ.Recognize
  modifiers: [search, room]
  description: Find the requested object in a room or on a placement location
  objects: [known_objects]
  conditions: {knowledge: known_instance, clutter: nearby, distractors: few, perception_range: far}
  level: '-'
  type: achievement
- id: OBJ-RECOGNIZE-03
  area: OBJ
  skill: Recognize
  variant_number: '03'
  taxonomy: OBJ.Recognize
  modifiers: [count, compare]
  description: Count the objects of a category, or name the biggest/lightest/... one, on a placement location
  objects: [known_objects]
  conditions: {knowledge: known_class, clutter: nearby, distractors: similar, perception_range: near}
  level: '-'
  type: achievement
- id: MAN-PICK-06
  area: MAN
  skill: Pick
  variant_number: '06'
  taxonomy: MAN.Pick
  modifiers: [requested_object]
  description: Take the requested object
  objects: [known_objects]
  conditions: {reach: [table, low_high], clutter: nearby, knowledge: known_instance}
  level: '-'
  type: achievement
- id: MAN-PLACE-04
  area: MAN
  skill: Place
  variant_number: '04'
  taxonomy: MAN.Place
  modifiers: [placement_location, trash]
  description: Place the object on the named placement location, or in the trash
  objects: [known_objects]
  conditions: {reach: [table, low_high], placement_tolerance: region, clutter: nearby}
  level: '-'
  type: achievement
- id: HRI-HANDOVER-02
  area: HRI
  skill: Handover
  variant_number: '02'
  taxonomy: HRI.Handover
  modifiers: [give, person]
  description: Hand the object to the person
  objects: [known_objects]
  level: '-'
  type: achievement
- id: PPL-DETECT-01
  area: PPL
  skill: Detect
  variant_number: '01'
  taxonomy: PPL.Detect
  modifiers: [gesture, pose, name]
  description: Find the person described by gesture, pose or name in a room
  conditions: {crowd: few, perception_range: far}
  level: '-'
  type: achievement
- id: PPL-DETECT-02
  area: PPL
  skill: Detect
  variant_number: '02'
  taxonomy: PPL.Detect
  modifiers: [count]
  description: Count the people in a room matching a gesture, pose or clothing
  conditions: {crowd: few, perception_range: room}
  level: '-'
  type: achievement
- id: PPL-REIDENTIFY-01
  area: PPL
  skill: Reidentify
  variant_number: '01'
  taxonomy: PPL.Reidentify
  modifiers: [met_earlier]
  description: Find again, in another room, a person met earlier in the command
  conditions: {crowd: few, distractors: few, retention: task, target_motion: static, ambient_noise: background}
  level: '-'
  type: achievement
- id: PPL-DESCRIBEATTRIBUTE-03
  area: PPL
  skill: DescribeAttribute
  variant_number: '03'
  taxonomy: PPL.DescribeAttribute
  modifiers: [clothing, identify]
  description: Find the person wearing the given colour and garment
  conditions: {info_load: few, target_motion: static, retention: immediate}
  level: '-'
  type: achievement
- id: PPL-DESCRIBEATTRIBUTE-04
  area: PPL
  skill: DescribeAttribute
  variant_number: '04'
  taxonomy: PPL.DescribeAttribute
  modifiers: [name, pose, gesture, report]
  description: Report the name, pose or gesture of a person
  conditions: {info_load: single, target_motion: static, retention: task}
  level: '-'
  type: achievement
- id: HRI-TELLINFO-01
  area: HRI
  skill: TellInfo
  variant_number: '01'
  taxonomy: HRI.ConveyInfo
  modifiers: [talk_list]
  description: Say the requested information (the time, the day, the team's name, something about itself)
  conditions: {info_load: single, retention: immediate, distractors: none}
  level: '-'
  type: achievement
- id: HRI-TELLINFO-02
  area: HRI
  skill: TellInfo
  variant_number: '02'
  taxonomy: HRI.ConveyInfo
  modifiers: [relay, person]
  description: Tell one person what was learned about another
  conditions: {info_load: single, retention: task, distractors: few}
  level: '-'
  type: achievement
- id: NAV-FOLLOW-02
  area: NAV
  skill: Follow
  variant_number: '02'
  taxonomy: NAV.Follow
  modifiers: [named_person]
  description: Follow the person to the named room
  conditions: {map_knowledge: mapped, route_extent: rooms, crowd: few}
  level: '-'
  type: achievement
- id: NAV-GUIDE-01
  area: NAV
  skill: Guide
  variant_number: '01'
  taxonomy: NAV.Guide
  modifiers: [person]
  description: Guide the person to the named location
  conditions: {map_knowledge: mapped, route_extent: rooms, crowd: few}
  level: '-'
  type: achievement
- id: PLN-COMPLETECOMMAND-01B
  area: PLN
  skill: CompleteCommand
  variant_number: 01B
  taxonomy: PLN.Execute
  modifiers: [goal_reached]
  description: Command goal reached (all its steps done, in a sensible order)
  conditions: {plan_length: [medium, long]}
  level: '-'
  type: bonus
  points_rule: calibrate    # see completion_bonus below

# How the completion bonus is set: so that an average command (generator
# weights) is worth what a solved command was worth in 2026. The TC may
# replace this with a fixed number.
completion_bonus:
  calibrate_to: 250

# ── the GPSR challenge, 2027 ────────────────────────────────────────────────
challenge:
  challenge: General Purpose Service Robot
  rulebook_section: '5.4'
  max_time_minutes: 7
  entries:
  - {ref: NLU-UNDERSTANDCOMMAND-01, count: 3, section: Main Goal}
  - {ref: NLU-UNDERSTANDCOMMAND-02P, count: 3, section: Main Goal, related_skill: NLU-UNDERSTANDCOMMAND-01}
  - {ref: NLU-UNDERSTANDCOMMAND-03P, count: 6, section: Main Goal, related_skill: NLU-UNDERSTANDCOMMAND-01}
  - {ref: PLN-DEMONSTRATEPLAN-01, count: 3, section: Main Goal}
  # skill lines: counts are filled in from command_steps (the most any three
  # commands can use)
  - {ref: NAV-NAVIGATE-06, section: Command steps}
  - {ref: OBJ-RECOGNIZE-02, section: Command steps}
  - {ref: OBJ-RECOGNIZE-03, section: Command steps}
  - {ref: MAN-PICK-06, section: Command steps}
  - {ref: MAN-PLACE-04, section: Command steps}
  - {ref: HRI-HANDOVER-02, section: Command steps}
  - {ref: PPL-DETECT-01, section: Command steps}
  - {ref: PPL-DETECT-02, section: Command steps}
  - {ref: PPL-REIDENTIFY-01, section: Command steps}
  - {ref: PPL-DESCRIBEATTRIBUTE-03, section: Command steps}
  - {ref: PPL-DESCRIBEATTRIBUTE-04, section: Command steps}
  - {ref: HRI-TELLINFO-01, section: Command steps}
  - {ref: HRI-TELLINFO-02, section: Command steps}
  - {ref: NAV-FOLLOW-02, section: Command steps}
  - {ref: NAV-GUIDE-01, section: Command steps}
  - {ref: PLN-COMPLETECOMMAND-01B, count: 3, section: Command steps}
  - {ref: PLN-INTERLEAVETASKS-01B, count: 1, section: Extra Rewards}
  - {ref: NLU-UNDERSTANDCOMMAND-04P, count: 3, section: Penalties, related_skill: NLU-UNDERSTANDCOMMAND-01}
  - {ref: SPECIAL-01, count: 1, section: Special Penalties & Bonuses}
  - {ref: SPECIAL-02, count: 1, section: Special Penalties & Bonuses}
  - {ref: SPECIAL-03, count: 1, section: Special Penalties & Bonuses}

# ── what each generator command scores ──────────────────────────────────────
# Steps in order; `then` names the follow-up slot the generator fills.
# Template and follow-up names are the generator's own.
command_steps:
  templates:
    goToLoc:                     {steps: [NAV-NAVIGATE-06], then: atLoc}
    takeObjFromPlcmt:            {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-02, MAN-PICK-06], then: hasObj}
    findPrsInRoom:               {steps: [NAV-NAVIGATE-06, PPL-DETECT-01], then: foundPers}
    findObjInRoom:               {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-02], then: foundObj}
    meetPrsAtBeac:               {steps: [NAV-NAVIGATE-06, PPL-DETECT-01], then: foundPers}
    countObjOnPlcmt:             {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-03, NAV-NAVIGATE-06]}
    countPrsInRoom:              {steps: [NAV-NAVIGATE-06, PPL-DETECT-02, NAV-NAVIGATE-06]}
    tellPrsInfoInLoc:            {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, PPL-DESCRIBEATTRIBUTE-04, NAV-NAVIGATE-06]}
    tellObjPropOnPlcmt:          {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-03, NAV-NAVIGATE-06]}
    talkInfoToGestPrsInRoom:     {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, HRI-TELLINFO-01]}
    followNameFromBeacToRoom:    {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, NAV-FOLLOW-02]}
    guideNameFromBeacToBeac:     {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, NAV-GUIDE-01]}
    guidePrsFromBeacToBeac:      {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, NAV-GUIDE-01]}
    guideClothPrsFromBeacToBeac: {steps: [NAV-NAVIGATE-06, PPL-DESCRIBEATTRIBUTE-03, NAV-GUIDE-01]}
    bringMeObjFromPlcmt:         {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-02, MAN-PICK-06, NAV-NAVIGATE-06, HRI-HANDOVER-02]}
    tellCatPropOnPlcmt:          {steps: [NAV-NAVIGATE-06, OBJ-RECOGNIZE-03, NAV-NAVIGATE-06]}
    greetClothDscInRm:           {steps: [NAV-NAVIGATE-06, PPL-DESCRIBEATTRIBUTE-03], then: foundPers}
    greetNameInRm:               {steps: [NAV-NAVIGATE-06, PPL-DETECT-01], then: foundPers}
    meetNameAtLocThenFindInRm:   {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, NAV-NAVIGATE-06, PPL-REIDENTIFY-01]}
    countClothPrsInRoom:         {steps: [NAV-NAVIGATE-06, PPL-DETECT-02, NAV-NAVIGATE-06]}
    tellPrsInfoAtLocToPrsAtLoc:  {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, PPL-DESCRIBEATTRIBUTE-04, NAV-NAVIGATE-06, PPL-DETECT-01, HRI-TELLINFO-02]}
    followPrsAtLoc:              {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, NAV-FOLLOW-02]}
  followups:
    findObj:                {steps: [OBJ-RECOGNIZE-02], then: foundObj}
    findPrs:                {steps: [PPL-DETECT-01], then: foundPers}
    meetName:               {steps: [PPL-DETECT-01], then: foundPers}
    placeObjOnPlcmt:        {steps: [NAV-NAVIGATE-06, MAN-PLACE-04]}
    putObjInTrash:          {steps: [NAV-NAVIGATE-06, MAN-PLACE-04]}
    deliverObjToMe:         {steps: [NAV-NAVIGATE-06, HRI-HANDOVER-02]}
    deliverObjToPrsInRoom:  {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, HRI-HANDOVER-02]}
    deliverObjToNameAtBeac: {steps: [NAV-NAVIGATE-06, PPL-DETECT-01, HRI-HANDOVER-02]}
    talkInfo:               {steps: [HRI-TELLINFO-01]}
    followPrs:              {steps: [NAV-FOLLOW-02]}
    followPrsToRoom:        {steps: [NAV-FOLLOW-02]}
    guidePrsToBeacon:       {steps: [NAV-GUIDE-01]}
    takeObj:                {steps: [MAN-PICK-06], then: hasObj}
  slots:                    # generator: followup_people / followup_objects
    atLoc:     [findPrs, meetName, findObj]
    foundPers: [talkInfo, followPrs, followPrsToRoom, guidePrsToBeacon]
    foundObj:  [takeObj]
    hasObj:    [putObjInTrash, placeObjOnPlcmt, deliverObjToMe, deliverObjToPrsInRoom, deliverObjToNameAtBeac]
  weights:                  # generator: commands are drawn from one list, 50/50
    people:                 #   person_cmd_list
      goToLoc: 8
      findPrsInRoom: 4
      meetPrsAtBeac: 4
      countPrsInRoom: 1
      tellPrsInfoInLoc: 1
      talkInfoToGestPrsInRoom: 6
      followNameFromBeacToRoom: 1
      guideNameFromBeacToBeac: 1
      guidePrsFromBeacToBeac: 1
      guideClothPrsFromBeacToBeac: 1
      greetClothDscInRm: 1
      greetNameInRm: 4
      meetNameAtLocThenFindInRm: 1
      countClothPrsInRoom: 1
      tellPrsInfoAtLocToPrsAtLoc: 1
      followPrsAtLoc: 1
    objects:                #   object_cmd_list
      goToLoc: 4
      takeObjFromPlcmt: 2
      findObjInRoom: 2
      countObjOnPlcmt: 1
      tellObjPropOnPlcmt: 1
      bringMeObjFromPlcmt: 1
      tellCatPropOnPlcmt: 1
