# One neglect penalty — PROPOSAL for 2027, not in force.
#
# 2026 has the same failure twice under two names and two prices:
#   HRI-ATTEND-01P      "Not acknowledging people"                    -200 (HRI)
#   HRI-EYECONTACT-01P  "Not making eye-contact when taking the order" -60 (Restaurant)
# Both are the league draft's #89 "not attending to interaction partner".
#
# Proposal: one line, one definition, one fixed price (vocabulary/pricing.yaml
# fixed_penalty.neglect). It is a conduct penalty, so it does not scale with
# the line it sits under. Gaze quality stays with the HRI.Gaze lines; this
# penalty is only for not engaging at all, so the two never count the same
# behaviour twice.

year: 2027
status: proposal

dictionary_changes:
  HRI-ATTEND-01P:
    description: >-
      Not attending to the person interacting with the robot: ignores, turns
      away from, or never responds to them (per interaction)
    points: -100

replace_refs:
  restaurant:
    HRI-EYECONTACT-01P: HRI-ATTEND-01P
