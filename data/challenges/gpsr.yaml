challenge: General Purpose Service Robot
rulebook_section: '5.4'
max_time_minutes: 7
method_note: Entries are the fixed primitives a generated command is scored against; the command generator composes them at runtime.
challenge_rules:
  autonomy_skip:
    source: §5.3 rule 7
    reductions_apply_to:
    - use of a custom operator
    - bypassing speech recognition
    - receiving human assistance to accomplish a command
    - instructing a human assistant to perform the whole task
    ambiguity: The last two are declared to incur reductions but have no quantified line on the score sheet. Either add explicit entries or state that §3.7.2 (score zero) governs.
  partial_scoring:
    source: §5.3 rule 2
    permitted: true
entries:
