# ── what each generator command scores ──────────────────────────────────────
# Steps in order; `then` names the follow-up slot the generator fills.
# Template and follow-up names are the generator's own.
command_steps:
  completion_bonus: PLN-EXECUTE-01B   # paid once per command whose goal holds
  templates:
    goToLoc:                     {steps: [NAV-NAVIGATE-04], then: atLoc}
    takeObjFromPlcmt:            {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-02, MAN-PICK-06], then: hasObj}
    findPrsInRoom:               {steps: [NAV-NAVIGATE-04, PPL-DETECT-01], then: foundPers}
    findObjInRoom:               {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-02], then: foundObj}
    meetPrsAtBeac:               {steps: [NAV-NAVIGATE-04, PPL-DETECT-01], then: foundPers}
    countObjOnPlcmt:             {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-03, NAV-NAVIGATE-04]}
    countPrsInRoom:              {steps: [NAV-NAVIGATE-04, PPL-DETECT-02, NAV-NAVIGATE-04]}
    tellPrsInfoInLoc:            {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, PPL-ATTRIBUTE-04, NAV-NAVIGATE-04]}
    tellObjPropOnPlcmt:          {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-03, NAV-NAVIGATE-04]}
    talkInfoToGestPrsInRoom:     {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, HRI-INFO-03]}
    followNameFromBeacToRoom:    {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, NAV-FOLLOW-02]}
    guideNameFromBeacToBeac:     {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, NAV-GUIDE-01]}
    guidePrsFromBeacToBeac:      {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, NAV-GUIDE-01]}
    guideClothPrsFromBeacToBeac: {steps: [NAV-NAVIGATE-04, PPL-ATTRIBUTE-03, NAV-GUIDE-01]}
    bringMeObjFromPlcmt:         {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-02, MAN-PICK-06, NAV-NAVIGATE-04, HRI-HANDOVER-01]}
    tellCatPropOnPlcmt:          {steps: [NAV-NAVIGATE-04, OBJ-RECOGNIZE-03, NAV-NAVIGATE-04]}
    greetClothDscInRm:           {steps: [NAV-NAVIGATE-04, PPL-ATTRIBUTE-03], then: foundPers}
    greetNameInRm:               {steps: [NAV-NAVIGATE-04, PPL-DETECT-01], then: foundPers}
    meetNameAtLocThenFindInRm:   {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, NAV-NAVIGATE-04, PPL-REIDENTIFY-01]}
    countClothPrsInRoom:         {steps: [NAV-NAVIGATE-04, PPL-DETECT-02, NAV-NAVIGATE-04]}
    tellPrsInfoAtLocToPrsAtLoc:  {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, PPL-ATTRIBUTE-04, NAV-NAVIGATE-04, PPL-DETECT-01, HRI-INFO-04]}
    followPrsAtLoc:              {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, NAV-FOLLOW-02]}
  followups:
    findObj:                {steps: [OBJ-RECOGNIZE-02], then: foundObj}
    findPrs:                {steps: [PPL-DETECT-01], then: foundPers}
    meetName:               {steps: [PPL-DETECT-01], then: foundPers}
    placeObjOnPlcmt:        {steps: [NAV-NAVIGATE-04, MAN-PLACE-04]}
    putObjInTrash:          {steps: [NAV-NAVIGATE-04, MAN-PLACE-04]}
    deliverObjToMe:         {steps: [NAV-NAVIGATE-04, HRI-HANDOVER-01]}
    deliverObjToPrsInRoom:  {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, HRI-HANDOVER-01]}
    deliverObjToNameAtBeac: {steps: [NAV-NAVIGATE-04, PPL-DETECT-01, HRI-HANDOVER-01]}
    talkInfo:               {steps: [HRI-INFO-03]}
    followPrs:              {steps: [NAV-FOLLOW-02]}
    followPrsToRoom:        {steps: [NAV-FOLLOW-02]}
    guidePrsToBeacon:       {steps: [NAV-GUIDE-01]}
    takeObj:                {steps: [MAN-PICK-06], then: hasObj}
  slots:                    # generator: followup_people / followup_objects
    atLoc:     [findPrs, meetName, findObj]
    foundPers: [talkInfo, followPrs, followPrsToRoom, guidePrsToBeacon]
    foundObj:  [takeObj]
    hasObj:    [putObjInTrash, placeObjOnPlcmt, deliverObjToMe, deliverObjToPrsInRoom, deliverObjToNameAtBeac]
  weights:                  # generator: commands are drawn from one list, 50/50
    people:                 #   person_cmd_list
      goToLoc: 8
      findPrsInRoom: 4
      meetPrsAtBeac: 4
      countPrsInRoom: 1
      tellPrsInfoInLoc: 1
      talkInfoToGestPrsInRoom: 6
      followNameFromBeacToRoom: 1
      guideNameFromBeacToBeac: 1
      guidePrsFromBeacToBeac: 1
      guideClothPrsFromBeacToBeac: 1
      greetClothDscInRm: 1
      greetNameInRm: 4
      meetNameAtLocThenFindInRm: 1
      countClothPrsInRoom: 1
      tellPrsInfoAtLocToPrsAtLoc: 1
      followPrsAtLoc: 1
    objects:                #   object_cmd_list
      goToLoc: 4
      takeObjFromPlcmt: 2
      findObjInRoom: 2
      countObjOnPlcmt: 1
      tellObjPropOnPlcmt: 1
      bringMeObjFromPlcmt: 1
      tellCatPropOnPlcmt: 1
