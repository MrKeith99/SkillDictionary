  count: 3
  section: Main Goal
  assistance:
    permitted: true
    listed_in_task_description: true
    self_score: 0
    extra_penalty_ref: NLU-UNDERSTANDCOMMAND-02P
    blocks_dependents: false
    note: Custom operator available only after the referee attempts three re-phrased commands.
- ref: NLU-UNDERSTANDCOMMAND-02P
  count: 3
  section: Main Goal
  related_skill: NLU-UNDERSTANDCOMMAND-01
  ambiguity: Fixed 3x-20 (-60, ~4% of 1490) conflicts with §3.7.4, which sets custom operator at -10% of maximum attainable score (-149). Confirm which governs.
