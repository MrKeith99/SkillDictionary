challenge: Doing Laundry
rulebook_section: '5.5'
max_time_minutes: 7
challenge_rules:
  cloth_placement:
    source: §5.4 rule 2
    rule: Clothes must be placed on the table before folding; folding on the floor is not allowed.
  folding_assistance_scale:
    source: §5.4 rule 6
    levels:
    - help: minimal (smoothing wrinkles, stabilizing cloth)
      penalty: -100
    - help: partial (folding one half, aligning edges)
      penalty: -200
    - help: major (completing entire fold/stack)
      penalty: maximum
    ambiguity: Rule 6 lists -100/-200 for minimal/partial help, but the score sheet lists -200 (main) and 5x-100 (additional) for flattening plus a separate percentage penalty up to -800/-400. Reconcile the two scales.
