# Pricing rule — PROPOSAL for 2027, not in force.
#
# Goal: the same skill at the same difficulty pays the same in every challenge,
# and the same failure costs the same share everywhere. `skilldict prices`
# applies this rule to every line and reports the change from the rulebook.
#
# Achievement   price = base[node] x (1 + D / d_scale), rounded
#               D = intrinsic difficulty of the easiest instance the line covers
#               (harder objects are paid by bonus lines, as the rulebook does).
# Bonus /       effective price (parent + line) = rule price at the line's D;
# discount      the line pays the difference from its parent.
# Penalty       -share[failure_mode] x price of the line it belongs to
#               (related_skill, or the line whose assistance it prices);
#               conduct failures (fixed_penalty) cost the same everywhere.
#
# base[node] is calibrated, not invented: the median over the node's lines in
# rulebook 2026.2 (git tag 2026.2) of price / (1 + D / d_scale). So the level
# stays where the league put it; only the spread inside a skill disappears.
# The bases are fixed here, so adding or editing a line never moves them;
# changing one is changing how much the league values a skill (TC decision).
#
# Lines the rule cannot price keep their value and are listed by
# `skilldict prices`: no difficulty factors, no parent for a penalty, or an
# explicit 0.

d_scale: 4            # D 0 -> x1, D 4 -> x2, D 8 -> x3

rounding:             # round to the nearest step for prices at or above `from`
  - {from: 50, step: 10}
  - {from: 0,  step: 5}

base:                 # node: points at D 0
  HRI.ConveyInfo: 35.24
  HRI.Gaze: 26.79
  HRI.Handover: 33.33
  HRI.Indicate: 66.67
  MAN.Fold: 300
  MAN.Insert: 64
  MAN.OperateArticulated: 133.33
  MAN.Pick: 60
  MAN.Place: 28.57
  MAN.Pour: 160
  MAN.Stack: 50
  MAN.Transport: 119.44
  NAV.Follow: 133.33
  NAV.Guide: 133.33          # no 2026 line: as NAV.Follow
  NAV.Navigate: 22.78
  NAV.SignalIntent: 12
  NLU.Clarify: 8.57
  NLU.UnderstandCommand: 58.41
  OBJ.DetectEvent: 20
  OBJ.DetectPlacement: 15
  OBJ.Recognize: 6.67
  PLN.Execute: 200
  PLN.Interleave: 133.33
  PLN.Plan: 66.67
  PPL.DescribeAttribute: 16
  PPL.Detect: 40             # no 2026 line: as PPL.DetectGesture
  PPL.DetectGesture: 40
  PPL.Reidentify: 40         # no 2026 line: as PPL.DetectGesture

fixed_penalty:
  # Conduct failures are not tied to one action, so a share of a line makes no
  # sense: ignoring a person is as bad next to a 15-point line as a 400-point one.
  neglect: -100
  unsafe_contact: -200    # on top of the rulebook's immediate stop (§ Collisions)

penalty_share:
  # Share of the parent line's price. 1.0 = the line is lost as a whole.
  drop:              0.5
  spill:             0.5
  damage:            1.0
  collision:         0.5
  wrong_target:      0.5
  wrong_info:        0.5
  quality:           1.0    # maximum; the referee scales by the share of the result that fails
  neglect:           0.5
  multiple_at_once:  1.0
  assistance:        0.5    # on top of the assisted element scoring zero (§3.7.2)
  alternative_input: 0.25
