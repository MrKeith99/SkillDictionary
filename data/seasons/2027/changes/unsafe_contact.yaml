# Unsafe contact with a person — PROPOSAL for 2027, not in force.
#
# 2026: touching a person is handled only by stopping the robot (general
# rules § Collisions; Restaurant: "Any physical contact with people ... results
# in immediate emergency stop"), plus possible disqualification. The score
# itself does not record it, so two runs that both stopped look the same
# whether the robot ran out of time or bumped into a guest.
#
# Proposal: one line in every challenge, fixed price
# (seasons/2027/pricing.yaml fixed_penalty.unsafe_contact), on top of the stop.
# Counted once: the run ends at the first occurrence.
# Not unsafe: contact the task asks for (a handover the person completes,
# functional touching of furniture announced by the robot).


dictionary_additions:
- id: GEN-UNSAFECONTACT-01P
  area: GEN
  skill: UnsafeContact
  variant_number: 01P
  taxonomy: GEN.UnsafeConduct
  modifiers: [person]
  description: Touching a person when the task does not ask for it (run also stopped)
  failure_mode: unsafe_contact
  level: '-'
  type: penalty_behavior
  points: -200

add_entries:
  gpsr:           [{ref: GEN-UNSAFECONTACT-01P, count: 1, section: Penalties}]
  hri:            [{ref: GEN-UNSAFECONTACT-01P, count: 1, section: Penalties}]
  pick_and_place: [{ref: GEN-UNSAFECONTACT-01P, count: 1, section: Penalties}]
  restaurant:     [{ref: GEN-UNSAFECONTACT-01P, count: 1, section: Penalties}]
  doing_laundry:  [{ref: GEN-UNSAFECONTACT-01P, count: 1, section: Penalties}]
