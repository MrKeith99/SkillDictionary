# Object set for one competition year — the ONLY object file that changes
# every year.
#
# `classes` is copied from the league's published object list (names and class
# membership unchanged). `categories` are the groupings the RULEBOOK uses in
# task descriptions ("cutlery", "common objects", "breakfast items"); they are
# what dictionary entries name in `objects:`.
#
# To start a new year: copy this file, replace `classes` from the new list,
# re-check `categories` against the new rulebook, add any new object to
# vocabulary/objects/catalog.yaml, and name the file in the season's season.yaml.

competition: RoboCup 2026 Incheon
source:
  repo: https://github.com/RoboCupAtHome/Incheon2026
  path: objects/objects.md, objects/test_objects.md
  commit: 993bb7015566b8c943cd379db781257cbd6ff81b

classes:
  fabric:          [white_shirt, grey_shirt, blue_shirt, black_shirt, hand_towel]
  toy:             [rubiks_cube]
  snack:           [pringles, seaweed]
  fruit:           [apple, peach, mangostane, lemon, yellow_bellpepper, red_bellpepper]
  food:            [instant_noodles, cornflakes]
  drink:           [coke, red_bull, milk, soju, pepsi]
  cleaning_supply: [dishwasher_tab, sponge, toothpaste]
  dish:            [cup, spoon, plate, knife, fork, bowl]

test_objects:
  carry_my_luggage: [bag]
  clean_the_table:  [dishwasher_tab]

# Rulebook groupings. A member is a catalog id or another name in this file
# (class or category), expanded recursively.
categories:
  known_objects:
    members: [fabric, toy, snack, fruit, food, drink, cleaning_supply, dish]
    source: Scenario — the full known-object list
  cutlery:
    members: [spoon, fork, knife]
    source: P&P §5.2 "Cutlery — one piece (fork, knife, or spoon)"
  dishwasher_items:
    members: [dish]
    source: P&P §5.2 "Place dirty tableware and cutlery inside the dishwasher"; the dish class (incl. bowl)
  breakfast:
    members: [bowl, spoon, milk, cornflakes]
    source: P&P §5.2 "a bowl, a spoon, milk and cereal"
  common_objects:
    members: [red_bull, pringles, rubiks_cube, toothpaste]
    source: Scenario — "A Red Bull can, a red Pringles container, a solved Rubik's cube and a Colgate toothpaste box"
  cabinet_objects:
    members: [toy, snack, fruit, food, drink, cleaning_supply]
    source: >-
      P&P §5.2 cabinet "arranged by category" — shelves are grouped by the classes
      above (objects.md); every non-dish, non-fabric object is stored next to its
      class. "Similar objects" = same class.
  trash:
    members: [toy, snack, fruit, food, drink, cleaning_supply]
    source: P&P §5.2 "One object category will be treated as trash" — announced at Setup Days, so any non-dish class
  clothing:
    members: [fabric]
    source: Doing Laundry
  restaurant_orders:
    members: [drink, snack, fruit, food]
    source: Restaurant — orders drawn from the known objects (not held in 2026 Incheon)
