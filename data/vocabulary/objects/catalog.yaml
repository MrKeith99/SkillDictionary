# Object catalog — one entry per REAL object, reused across years.
#
# The year's object set (set.yaml) says which of these are in play and
# how they are grouped; dictionary entries name those groups. This file only
# says what each object physically is.
#
# Fields
#   name            human name
#   mass_g          mass in grams, with contents as used in the arena
#   grasp_width_mm  narrowest dimension the object can be gripped across
#   surface, rigidity, shape, stability, contents
#                   judged levels from difficulty_factors.yaml. mass and size
#                   levels are NOT written here: they are computed from the
#                   numbers above, so two people cannot rate them differently.
#   garment, spread judged levels for clothing (MAN.Fold)
#   parts           closures the robot opens (a cap), named `<object>.<part>`
#                   in a variant's objects; rated by opening, actuation_force and
#                   counterpart (MAN.OpenContainer)
#   note            anything that explains a judgement, and where the numbers
#                   come from when it is not obvious (a YCB item: Calli et al.
#                   2015, arXiv:1502.03143, Table II)
#
# Ids are the names the league uses in its object list, so a year set can be
# copied from the published list without renaming.

version: 1
# Where mass_g and grasp_width_mm come from, for the whole file: estimate (YCB
# published values or product specs, see each note) until they are weighed and
# measured on the arena objects at Setup Days; then set `values: measured`.
values: estimate

