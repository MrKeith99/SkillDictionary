# Difficulty factors — HOW HARD one instance of a skill is, from the object and
# the situation, never from the robot's method.
#
# Why factors instead of more skills: "PickTinyKnown, PickHeavyKnown,
# PickLargeUnknown, ..." multiplies verbs by every property and still cannot
# express "heavy AND slippery AND inside the dishwasher". One Pick skill plus a
# handful of factors covers every combination, and new objects need a profile in
# objects/catalog.yaml (new furniture: objects/furniture.yaml), not a new skill.
#
# Rules
#   * Every factor has at most three levels, weighted 0 / 1 / 2. Coarse on
#     purpose: a referee must be able to assign a level by looking, and finer
#     scales would imply precision nobody can measure consistently.
#   * `source: object` factors are properties of the thing being handled and
#     live in objects/catalog.yaml (parts: furniture.yaml). `source: place`
#     factors are properties of where the skill happens and live in
#     objects/furniture.yaml; a line names its places in `at:`.
#     `source: condition` factors describe the situation and are set on the
#     dictionary entry (`conditions:`).
#   * Factors with a `measure` are computed from a number: with `below`
#     cut-offs (levels in ascending order, the last without one), or with
#     `within` ranges (the first level whose ranges hold the value; a level
#     without ranges takes the rest). The others are judged once per object or
#     place.
#   * A factor only counts for a skill if the skill lists it.
#     Mass matters to Pick; it does not matter to Recognize.
#
# Intrinsic difficulty D = sum of weights of the applicable factors.
# It is a property of the SPECIFICATION, and the only difficulty rating: the
# price follows it (docs/skill-model.md, Toward a fair price).

version: 1

factors:

  # ── object properties ───────────────────────────────────────────────────────
  mass:
    source: object
    question: How heavy is the object (with contents)?
    measure: mass_g          # computed from the catalog value, never typed by hand
    levels:
      light:  {weight: 0, below: 250,  guide: "< 250 g — cutlery, enamel cup, shirt"}
      medium: {weight: 1, below: 1000, guide: "250–1000 g — cans, soju bottle, small milk carton"}
      heavy:  {weight: 2,              guide: "≥ 1000 g — 1.5 L bottle, packed bag"}

  size:
    source: object
    question: Across its narrowest graspable dimension, how big is the object?
    measure: grasp_width_mm  # computed from the catalog value, never typed by hand
    levels:
      thin:    {weight: 2, below: 15, guide: "< 15 mm — cutlery handle, plate rim, cloth"}
      regular: {weight: 0, below: 81, guide: "15–80 mm — cans, cups, boxes"}
      bulky:   {weight: 1,            guide: "> 80 mm — exceeds most gripper openings"}

  surface:
    source: object
    question: How easily does the surface slip?
    levels:
      grippy:   {weight: 0, guide: "fabric, paper, cardboard, rubber"}
      smooth:   {weight: 1, guide: "glazed ceramic, glossy plastic, metal, glass"}
      slippery: {weight: 2, guide: "wet, oily, or film-wrapped"}

  rigidity:
    source: object
    question: Does the object keep its shape when held?
    levels:
      rigid:      {weight: 0, guide: "cups, boxes, cutlery"}
      compliant:  {weight: 1, guide: "gives a little under the grip but keeps its shape — carton, snack bag, sponge, soft fruit; must be held without crushing"}
      deformable: {weight: 2, guide: "clothing, towels — shape changes with every grasp"}

  shape:
    source: object
    question: Is there an obvious place to hold it?
    levels:
      regular:    {weight: 0, guide: "box, cylinder, handle"}
      irregular:  {weight: 1, guide: "concave or asymmetric — bowl, mug by the body"}
      flat_lying: {weight: 2, guide: "lies flush on its support — plate, flat cloth"}

  stability:
    source: object
    question: (placing) Does it stay where it is set down?
    levels:
      stable:   {weight: 0, guide: "flat or wide base — plate, mug, box, can no taller than twice its width, cloth"}
      unsteady: {weight: 1, guide: "tips or rocks — taller than twice its width (bottle, slim can), or a curved base (bell pepper)"}
      rolls:    {weight: 2, guide: "round, rolls away unless placed in a hollow or against an edge — apple, lemon, peach"}

  contents:
    source: object
    question: Does the object contain something that constrains its motion?
    levels:
      none:    {weight: 0, guide: "solid object or closed container"}
      upright: {weight: 1, guide: "open container with liquid/granular content, must stay level"}

  garment:
    source: object
    question: (clothing) How is the garment built?
    levels:
      flat:    {weight: 0, guide: "one flat piece — cleaning cloth, towel, napkin"}
      tubular: {weight: 1, guide: "a tube, often in pairs — socks"}
      limbed:  {weight: 2, guide: "sleeves or legs to fold in — T-shirt, shirt, trousers"}

  spread:
    source: object
    question: (clothing) How big is it laid out flat, along its longest side?
    levels:
      small:  {weight: 0, guide: "< 40 cm — cleaning cloth, socks"}
      medium: {weight: 1, guide: "40–80 cm — hand towel, T-shirt"}
      large:  {weight: 2, guide: "> 80 cm — trousers, bath towel; needs re-grasping across the table"}

  counterpart:
    source: object
    question: (containers) What holds the container while the robot opens it?
    levels:
      fixed:  {weight: 0, guide: "fixed in place — container clamped or built in"}
      loose:  {weight: 1, guide: "a free-standing object resting on a surface, may slide or tip — jar on a table"}
      held:   {weight: 2, guide: "the robot must hold or steady it while operating the part — soft carton, bottle in hand"}


  handle:
    source: object
    question: (fixture parts) What does the robot take hold of to move it?
    levels:
      bar:      {weight: 0, guide: "a protruding bar, rail or edge to pull or push — fridge handle, rack wire"}
      release:  {weight: 1, guide: "a lever or knob to turn, or a latch to release, before it moves — door lever, porthole handle"}
      recessed: {weight: 2, guide: "nothing protrudes: finger slot, flush grip, magnetic edge"}

  return_force:
    source: object
    question: (fixture parts) Does it stay where it is let go?
    levels:
      stays:        {weight: 0, guide: "stays in any position — rack, counterweighted door"}
      drifts:       {weight: 1, guide: "drifts back near the closed position — fridge door seal"}
      self_closing: {weight: 2, guide: "swings shut unless held or blocked — door closer, spring hinge"}

  opening:
    source: object
    question: (containers) How does the closure come off?
    levels:
      lift:  {weight: 0, guide: "lifts or flips off — loose lid, flip-top"}
      twist: {weight: 1, guide: "torsion — screw cap, jar lid"}
      pry:   {weight: 2, guide: "press and lever an edge — ring-pull tab, crown cap"}

  actuation_force:
    source: object
    question: (fixture parts, containers) How much force or torque does it take?
    levels:
      low:    {weight: 0, guide: "< 10 N"}
      medium: {weight: 1, guide: "10–30 N"}
      high:   {weight: 2, guide: "> 30 N — sprung or weighted doors"}

  # ── situation / conditions ──────────────────────────────────────────────────
  height:
    source: place
    question: How high is the surface the robot works on?
    measure: height_mm       # computed from furniture.yaml, never typed by hand
    levels:
      comfortable: {weight: 0, within: [[600, 1100]], guide: "0.6–1.1 m — table, counter, middle shelf"}
      low_high:    {weight: 1, within: [[250, 600], [1100, 1500]], guide: "0.25–0.6 m or 1.1–1.5 m — sofa, coffee table, low or upper shelf"}
      extreme:     {weight: 2, guide: "below 0.25 m or above 1.5 m — floor, bottom shelf, top of a tall cabinet"}

  access:
    source: place
    question: How much does the furniture around the place get in the way?
    levels:
      open:     {weight: 0, guide: "open surface, free from above and the sides — table top, bed, floor"}
      bounded:  {weight: 1, guide: "a board above or walls around — shelf, basket, bin, sink"}
      enclosed: {weight: 2, guide: "behind a door or inside a machine — dishwasher rack, washing machine drum"}

  clutter:
    source: condition
    question: What is around the object?
    levels:
      isolated: {weight: 0, guide: "nothing within ~5 cm"}
      nearby:   {weight: 1, guide: "other objects within ~5 cm"}
      piled:    {weight: 2, guide: "stacked, touching, entangled"}

  knowledge:
    source: condition
    question: Has the robot seen (or heard) this exact thing before — object, sound, person, word?
    levels:
      known_instance: {weight: 0, guide: "exact object/sound/person/phrase published before the test"}
      known_class:    {weight: 1, guide: "category known, instance not — 'any traditional doorbell', 'any popular English name'"}
      unknown:        {weight: 2, guide: "never seen, category not given — a drink not on the object list"}

  placement_tolerance:
    source: condition
    question: How exact must the final pose be?
    levels:
      region:      {weight: 0, guide: "anywhere in an area or on a surface"}
      spot:        {weight: 1, guide: "a specific spot or semantic group — next to the bowl, with similar items"}
      constrained: {weight: 2, guide: "a slot, rack tines, aligned stack, cleanable orientation"}

  carrier:
    source: condition
    question: Is a loose carrier used for transport?
    levels:
      none:       {weight: 0, guide: "object held directly or in a fixed robot container"}
      unattached: {weight: 2, guide: "loose tray or basket that must itself be balanced"}

  map_knowledge:
    source: condition
    question: How well does the robot know the space?
    levels:
      mapped:  {weight: 0, guide: "fixed, mapped location"}
      moved:   {weight: 1, guide: "furniture may have moved, location given at runtime"}
      unknown: {weight: 2, guide: "unmapped environment"}

  crowd:
    source: condition
    question: How many people move around the robot?
    levels:
      none:  {weight: 0, guide: "only the operator"}
      few:   {weight: 1, guide: "a few people, mostly static"}
      crowd: {weight: 2, guide: "many moving people, occlusions"}

  obstacle_visibility:
    source: condition
    question: How hard are obstacles to perceive?
    levels:
      large:       {weight: 0, guide: "furniture-sized"}
      small:       {weight: 1, guide: "below laser plane, small"}
      hard_to_see: {weight: 2, guide: "transparent, thin, reflective, or a marked no-go area with no physical boundary"}

  input_variability:
    source: condition
    question: How varied is the language the robot must understand?
    levels:
      fixed:      {weight: 0, guide: "known phrase set"}
      paraphrase: {weight: 1, guide: "grammar-generated or paraphrased"}
      open:       {weight: 2, guide: "free speech from non-experts, noise"}

  # ── people, space, language (NAV, OBJ, PPL, HRI, NLU, PLN) ─────────────────
  # Same rules as above: three coarse levels a referee can set from the task
  # description and what they see, never from how the robot works.

  route_extent:
    source: condition
    question: How far, topologically, does the robot travel?
    levels:
      room:     {weight: 0, guide: "within one room or one open space (a restaurant floor)"}
      rooms:    {weight: 1, guide: "across rooms, through doorways"}
      building: {weight: 2, guide: "corridors, lifts, or out of the arena and back"}

  perception_range:
    source: condition
    question: How far away is the person, object or signal to perceive?
    levels:
      near:  {weight: 0, guide: "≤ 1.5 m, in front of the robot"}
      room:  {weight: 1, guide: "anywhere in the same room"}
      far:   {weight: 2, guide: "across a large space or another room; must be searched for"}

  target_motion:
    source: condition
    question: Does the person the skill is aimed at move?
    levels:
      static:   {weight: 0, guide: "seated or standing still"}
      shifting: {weight: 1, guide: "sways, paces, changes seat — 'guests move slightly'"}
      walking:  {weight: 2, guide: "walks freely while the skill runs"}

  distractors:
    source: condition
    question: How many plausible wrong answers are present?
    levels:
      none:    {weight: 0, guide: "only one candidate person, object, place or class"}
      few:     {weight: 1, guide: "a few candidates, easy to tell apart"}
      similar: {weight: 2, guide: "several near-identical candidates — identical chairs, look-alike guests, neighbouring shelf categories"}

  ambient_noise:
    source: condition
    question: How noisy is it where the robot listens?
    levels:
      quiet:      {weight: 0, guide: "arena with spectators silent"}
      background: {weight: 1, guide: "arena during a test — spectators, other people talking"}
      loud:       {weight: 2, guide: "public venue, music, several people speaking at once"}

  info_load:
    source: condition
    question: How many separate items must be understood, stored or stated in this line?
    levels:
      single: {weight: 0, guide: "one item — a name, one attribute"}
      few:    {weight: 1, guide: "2–3 items — name and drink, a two-object order"}
      many:   {weight: 2, guide: "4 or more — a summary, several people's details"}

  retention:
    source: condition
    question: How long must the robot keep the information before using it?
    levels:
      immediate: {weight: 0, guide: "used in the same exchange it was learned in"}
      task:      {weight: 1, guide: "used later in the task, after other activity"}
      long:      {weight: 2, guide: "used in another task, or after the person changed place or appearance"}

  plan_length:
    source: condition
    question: How many skills must be chained to reach the goal?
    levels:
      short:  {weight: 0, guide: "1–2 skills"}
      medium: {weight: 1, guide: "3–4 skills"}
      long:   {weight: 2, guide: "5 or more, or a search with an unknown number of steps"}
