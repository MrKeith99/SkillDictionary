# Object catalog — one entry per REAL object, reused across years.
#
# The year's object set (sets/<year>.yaml) says which of these are in play and
# how they are grouped; dictionary entries name those groups. This file only
# says what each object physically is.
#
# Fields
#   name            human name
#   ycb             YCB dataset id, when the object is (equivalent to) a YCB item.
#                   The rulebook draws objects from YCB (§ Scenario); YCB
#                   publishes mass and dimensions, so prefer its values.
#   mass_g          mass in grams, with contents as used in the arena
#   grasp_width_mm  narrowest dimension the object can be gripped across
#   values          where mass_g / grasp_width_mm come from, best first:
#                     measured  weighed and measured on the arena object
#                     ycb       YCB published values (Calli et al. 2015,
#                               arXiv:1502.03143, Table II) — only when the
#                               arena object is the same kind of item
#                     estimate  from photos or product specs; replace during
#                               Setup Days (check_taxonomy.py lists these)
#   surface, rigidity, shape, contents
#                   judged levels from difficulty_factors.yaml. mass and size
#                   levels are NOT written here: they are computed from the
#                   numbers above, so two people cannot rate them differently.
#   note            anything that explains a judgement
#
# Ids are the names the league uses in its object list, so a year set can be
# copied from the published list without renaming.

